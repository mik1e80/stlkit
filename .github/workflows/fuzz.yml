name: Deterministic parser mutations
on:
  push:
    branches: [main]
    paths: ['moon.mod', '**/*.mbt', 'scripts/fuzz.mbtx', 'scripts/check-toolchain.mbtx', '.github/workflows/fuzz.yml']
  pull_request:
    paths: ['moon.mod', '**/*.mbt', 'scripts/fuzz.mbtx', 'scripts/check-toolchain.mbtx', '.github/workflows/fuzz.yml']
  workflow_dispatch:
    inputs:
      cases:
        description: Cases per backend
        type: choice
        options: ['1000', '10000']
        default: '1000'
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - run: moon run scripts/check-toolchain.mbtx
      - name: Compare four backends with bounded child processes
        env:
          FUZZ_CASES: ${{ inputs.cases || '1000' }}
        run: moon run scripts/fuzz.mbtx all "$FUZZ_CASES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-logs
          path: _build/fuzz-*.log
