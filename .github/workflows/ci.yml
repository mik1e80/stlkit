name: 检查、构建、测试

# 每次推到 main、以及每个 PR 都跑一遍。
#
# 本工作流检查库、CLI 和网页；pages.yml 从同一提交重建网页后部署。
#
# 三件事分开跑而不是串成一条命令，是为了在 Actions 页面上能一眼看出是哪一步挂了。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 装 MoonBit 工具链
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 依赖装到 .mooncakes/，缓存起来省得每次重新下
      - name: 缓存依赖
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.moon/registry
          key: moon-registry-${{ hashFiles('moon.mod') }}
          restore-keys: moon-registry-

      - name: 解析依赖
        run: moon update

      - name: 核对工具链版本
        run: moon run scripts/check-toolchain.mbtx

      - name: 格式检查
        run: moon fmt --check

      - name: 独立 MoonBit 脚本格式检查
        run: moon fmt scripts/fuzz.mbtx scripts/consumer-smoke.mbtx scripts/limits-smoke.mbtx scripts/json-smoke.mbtx scripts/indexed-memory.mbtx scripts/acceptance-smoke.mbtx scripts/build-web.mbtx scripts/boundary-smoke.mbtx scripts/check-third-party.mbtx scripts/check-toolchain.mbtx scripts/quickstart-smoke.mbtx scripts/package-smoke.mbtx scripts/round2-smoke.mbtx --check

      - name: 检查（全目标，零警告才算过）
        run: moon check --target all --deny-warn

      - name: 构建
        run: moon build

      - name: Wasm 后端测试
        run: moon test --target wasm

      - name: Wasm-GC 后端测试
        run: moon test --target wasm-gc

      - name: JS 后端测试
        run: moon test --target js

      - name: Native 后端测试
        run: moon test --target native

      - name: CLI 参数和退出码回归
        run: node cmd/main/smoke.cjs

      - name: README 推荐示例及解析值复核
        run: moon run scripts/quickstart-smoke.mbtx

      - name: CLI 资源限制真实入口
        run: moon run scripts/limits-smoke.mbtx

      - name: JSON 协议与退出码真实入口
        run: moon run scripts/json-smoke.mbtx

      - name: 质量属性、导出复核与文件保护回归
        run: moon run scripts/acceptance-smoke.mbtx

      - name: 新增边界及来源许可回归
        run: |
          moon run scripts/boundary-smoke.mbtx
          moon run scripts/check-third-party.mbtx
          moon run scripts/package-smoke.mbtx
          moon run scripts/round2-smoke.mbtx

      - name: 验证审查案例和报告未过期
        run: |
          node scripts/review-cases.cjs
          git diff --exit-code -- examples/review

      - name: 模型语料、许可证及真实 CLI 回归
        run: |
          python3 scripts/prepare-scan.py
          node scripts/corpus-cases.cjs --check

      - name: 100k 连通网格全量与分块一致性
        env:
          PYTHON: python3
        run: node scripts/stress-cases.cjs --ci

      # 编译产物可能随平台或工具链版本变化，因此验证运行结果，不比较字节。
      # Pages 部署也会重新构建；本地直接打开网页使用仓库随附的产物。
      - name: 网页版能编译出来
        run: moon run scripts/build-web.mbtx

      - name: 网页检查和修复回归
        run: node web/smoke.cjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Install MoonBit
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: moon update
      - run: moon run scripts/check-toolchain.mbtx
      - run: moon check --target all --deny-warn
      - run: node cmd/main/smoke.cjs
      - run: moon run scripts/quickstart-smoke.mbtx
      - run: moon run scripts/acceptance-smoke.mbtx
      - run: moon run scripts/boundary-smoke.mbtx
      - run: moon run scripts/check-third-party.mbtx
      - run: moon run scripts/package-smoke.mbtx
      - run: moon run scripts/round2-smoke.mbtx
      # Published-package installation is tested on Linux and Windows by
      # consumer.yml after publication; a candidate version is not public yet.
