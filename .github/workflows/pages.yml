name: 部署网页版到 GitHub Pages

# 把 web/ 发布成一个网址，评委点开就能用。
#
# 部署前由同一提交的源码重建并执行网页回归，避免发布过时的 dist/web.js。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 连着推几次时只保留最后一次
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 解析依赖
        run: moon update

      - name: Verify compiler baseline
        run: moon run scripts/check-toolchain.mbtx

      - name: 构建并检查网页
        run: |
          moon run scripts/build-web.mbtx
          node web/smoke.cjs

      - name: 准备站点文件
        run: |
          mkdir -p _site/dist
          cp web/index.html _site/
          cp web/style.css   _site/
          cp web/app.js      _site/
          cp web/dist/web.js _site/dist/
          cp LICENSE _site/
          cp -R web/licenses _site/licenses

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
