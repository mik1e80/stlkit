name: 部署网页版到 GitHub Pages

# 把 web/ 发布成一个网址，评委点开就能用。
#
# 部署前由同一提交的源码重建并执行网页回归，避免发布过时的 dist/web.js。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 连着推几次时只保留最后一次
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: 解析依赖
        run: moon update

      - name: 构建并检查网页
        run: |
          bash web/build.sh
          node web/smoke.cjs

      - name: 准备站点文件
        run: |
          mkdir -p _site/dist
          cp web/index.html _site/
          cp web/style.css   _site/
          cp web/app.js      _site/
          cp web/dist/web.js _site/dist/
          cp LICENSE THIRD_PARTY_NOTICES.md _site/
          cp -R web/licenses _site/licenses

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
