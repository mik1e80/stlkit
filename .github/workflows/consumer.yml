name: Published package consumer
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published numeric version, without v
        default: '0.2.0'
        required: true
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - run: moon run scripts/check-toolchain.mbtx
      - name: Install published package in a fresh project
        env:
          CONSUMER_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: moon run scripts/consumer-smoke.mbtx "${CONSUMER_VERSION#v}"
