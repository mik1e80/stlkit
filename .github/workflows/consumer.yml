name: Published package consumer
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published numeric version, without v
        default: '0.2.3'
        required: true
permissions:
  contents: read
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Install MoonBit on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: moon update
      - run: moon run scripts/check-toolchain.mbtx
      - name: Install published package in a fresh project
        shell: bash
        env:
          CONSUMER_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: moon run scripts/consumer-smoke.mbtx "${CONSUMER_VERSION#v}"
